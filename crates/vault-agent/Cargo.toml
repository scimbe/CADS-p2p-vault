[package]
name = "vault-agent"
version = "0.0.0"
edition = "2021"

[lib]
name = "vault_agent"
path = "src/lib.rs"

[[bin]]
name = "vault-agent"
path = "src/main.rs"

[[bin]]
name = "gossip-handler"
path = "src/bin/gossip_handler.rs"

[dependencies]
vault-manifest = { path = "../vault-manifest" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
base64 = "0.22"
